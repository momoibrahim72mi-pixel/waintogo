server {
  listen 8080;
  root /usr/share/nginx/html;

  # Le chiamate /api/... vanno all'API. "api" è il nome del servizio
  # sia in docker compose sia (più avanti) in Kubernetes.
  location /api/ {
    proxy_pass http://api:3001/;
  }

  # È una "single page app": ogni indirizzo sconosciuto riceve index.html
  # e poi è React a decidere quale pagina mostrare.
  location / {
    try_files $uri /index.html;
  }

  location = /healthz {
    return 200 "ok\n";
  }
}
