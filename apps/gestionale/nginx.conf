server {
  listen 8080;
  root /usr/share/nginx/html;

  # Le chiamate /api/... vanno all'API. "api" è il nome del servizio
  # sia in docker compose sia (più avanti) in Kubernetes.
  location /api/ {
    proxy_pass http://api:3001/;
  }

  # È una "single page app": ogni indirizzo sconosciuto riceve index.html
  # e poi è React a decidere quale pagina mostrare.
  location / {
    # no-cache su index.html: ogni volta si controlla se c'è una versione nuova dell'app.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # I file compilati hanno un "hash" nel nome che cambia a ogni versione:
  # il browser può tenerli in memoria per un anno senza chiedere di nuovo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Il service worker della webapp va sempre ricontrollato,
  # altrimenti i telefoni resterebbero bloccati su una versione vecchia.
  location = /webapp-sw.js {
    add_header Cache-Control "no-cache";
  }

  # Il manifest della webapp: nginx non conosce l'estensione .webmanifest, glielo diciamo noi.
  location = /webapp.webmanifest {
    default_type application/manifest+json;
  }

  location = /healthz {
    return 200 "ok\n";
  }
}
