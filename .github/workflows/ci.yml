# CI: a ogni push e pull request controlla che tutto compili e che i test passino.
# Più avanti aggiungeremo la costruzione delle immagini ARM64 e l'invio al registry di OCI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Un Postgres vero, acceso solo per la durata della CI: i test dell'API lo usano.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waintogo
          POSTGRES_PASSWORD: cambiami
          POSTGRES_DB: waintogo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waintogo"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
